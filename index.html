<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Activity Recognition — Sangram Suresh Puri</title><style>body{font-family:Arial;max-width:760px;margin:60px auto;padding:0 20px;line-height:1.6}.card{border:1px solid #ddd;border-radius:14px;padding:28px}button{padding:10px 18px;border:0;border-radius:8px}.message{margin-top:20px;padding:12px;background:#f3f3f3}.error{margin-top:20px;padding:12px;background:#ffe5e5}</style></head><body><div class="card"><h1>Human Activity Recognition</h1><p><strong>Author:</strong> Sangram Suresh Puri</p><p>Upload a short video for the pose-based activity recognition pipeline.</p><form method="POST" action="/upload" enctype="multipart/form-data"><input type="file" name="video" accept=".mp4,.avi,.mov" required><button type="submit">Upload Video</button></form>{% if message %}<div class="message">{{message}}</div>{% endif %}{% if error %}<div class="error">{{error}}</div>{% endif %}</div></body></html>
